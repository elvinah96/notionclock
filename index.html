<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Race Timezones</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #ffffff;
    --card-bg: #f7f7f8;
    --card-border: #e7e7ea;
    --text-primary: #1a1a1d;
    --text-secondary: #6b6b73;
    --accent: #3b6bf6;
    --accent-soft: #eaf0ff;
    --danger: #e2483a;
    --night-tint: #eef0f6;
    --day-tint: #fff9e8;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 1px 8px rgba(0,0,0,0.03);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a;
      --card-bg: #202024;
      --card-border: #2d2d33;
      --text-primary: #f0f0f2;
      --text-secondary: #9a9aa2;
      --accent: #6d8dfc;
      --accent-soft: #262c42;
      --danger: #ff6b5e;
      --night-tint: #1b1d29;
      --day-tint: #262417;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 10px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171a;
    --card-bg: #202024;
    --card-border: #2d2d33;
    --text-primary: #f0f0f2;
    --text-secondary: #9a9aa2;
    --accent: #6d8dfc;
    --accent-soft: #262c42;
    --danger: #ff6b5e;
    --night-tint: #1b1d29;
    --day-tint: #262417;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 10px rgba(0,0,0,0.25);
  }

  html, body {
    height: 100%;
  }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    min-height: 100%;
  }

  .wrap {
    max-width: none;
    width: 100%;
    margin: 0 auto;
  }

  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
    margin-bottom: 10px;
  }

  .header h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    text-transform: uppercase;
    margin: 0;
  }

  .header-date {
    font-size: 26px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }

  .header-time {
    font-size: 46px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    line-height: 1;
    margin-top: 2px;
  }

  .grid {
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 6px; /* room for scrollbar so it doesn't clip the cards */
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .grid::-webkit-scrollbar {
    height: 6px;
  }
  .grid::-webkit-scrollbar-thumb {
    background: var(--card-border);
    border-radius: 999px;
  }

  .card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 13px;
    padding: 9px 9px 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
    min-height: auto;
    flex: 1 1 0;
    min-width: 100px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card .tint-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
  }
  .tint-day { background: linear-gradient(90deg, #ffd76a, #ffb84d); }
  .tint-night { background: linear-gradient(90deg, #5b6ee8, #7d5be8); }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  .city-name {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tz-label {
    display: none;
  }

  .offset-pill {
    display: none;
  }

  .time {
    font-size: 34px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    margin-top: 4px;
    line-height: 1.1;
    white-space: nowrap;
  }
  .time .secs {
    display: none;
  }

  .swahili-time {
    font-size: 9px;
    font-style: italic;
    color: var(--text-secondary);
    margin-top: 1px;
    min-height: 12px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .weather-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 5px;
    font-size: 16px;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .weather-row .icon {
    font-size: 21px;
    line-height: 1;
  }

  .weather-row .temp {
    font-weight: 600;
    color: var(--text-primary);
  }

  .sun-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 4px;
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
    min-height: 14px;
  }

  .sun-row .icon {
    font-size: 13px;
    line-height: 1;
  }

  .card-actions {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .card:hover .card-actions,
  .card:focus-within .card-actions { opacity: 1; }

  .icon-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 13px;
    padding: 3px 5px;
    border-radius: 6px;
    line-height: 1;
  }
  .icon-btn:hover { background: var(--card-border); color: var(--text-primary); }
  .icon-btn.danger:hover { color: var(--danger); }

  .empty {
    text-align: center;
    padding: 48px 16px;
    color: var(--text-secondary);
    font-size: 13px;
  }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    width: 100%;
    max-width: 380px;
    padding: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.2);
  }
  .modal h2 {
    font-size: 15px;
    margin: 0 0 16px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--bg);
    color: var(--text-primary);
    font-size: 13.5px;
    font-family: inherit;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .hint {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 5px;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }
  .btn {
    appearance: none;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: transparent; color: var(--text-secondary); }
  .btn-secondary:hover { color: var(--text-primary); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>Race Timezones</h1>
      <div class="header-date" id="headerDate"></div>
      <div class="header-time" id="headerTime"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="emptyState" style="display:none;">
      No cities configured.
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">Add a city</h2>
      <div class="field">
        <label for="cityInput">Label</label>
        <input id="cityInput" type="text" placeholder="e.g. Los Angeles" autocomplete="off">
      </div>
      <div class="field">
        <label for="tzSelect">Timezone</label>
        <select id="tzSelect"></select>
      </div>
      <div class="field">
        <label for="tzCustom">Or type any IANA timezone (optional)</label>
        <input id="tzCustom" type="text" placeholder="e.g. Asia/Seoul" autocomplete="off">
        <div class="hint">Overrides the dropdown above if filled in.</div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelAdd">Cancel</button>
        <button class="btn btn-primary" id="saveAdd">Save</button>
      </div>
    </div>
  </div>

<script>
(function() {
  var STORAGE_KEY = "worldclock.cities.v1";
  var editingIndex = null;

  var COMMON_ZONES = [
    ["London", "Europe/London"],
    ["Birmingham", "Europe/London"],
    ["Paris", "Europe/Paris"],
    ["Dublin", "Europe/Dublin"],
    ["Lisbon", "Europe/Lisbon"],
    ["Berlin", "Europe/Berlin"],
    ["Madrid", "Europe/Madrid"],
    ["Rome", "Europe/Rome"],
    ["Amsterdam", "Europe/Amsterdam"],
    ["New York", "America/New_York"],
    ["Los Angeles", "America/Los_Angeles"],
    ["Chicago", "America/Chicago"],
    ["Toronto", "America/Toronto"],
    ["Vancouver", "America/Vancouver"],
    ["Mexico City", "America/Mexico_City"],
    ["Sao Paulo", "America/Sao_Paulo"],
    ["Dubai", "Asia/Dubai"],
    ["Mumbai", "Asia/Kolkata"],
    ["Singapore", "Asia/Singapore"],
    ["Hong Kong", "Asia/Hong_Kong"],
    ["Tokyo", "Asia/Tokyo"],
    ["Seoul", "Asia/Seoul"],
    ["Shanghai", "Asia/Shanghai"],
    ["Bangkok", "Asia/Bangkok"],
    ["Sydney", "Australia/Sydney"],
    ["Melbourne", "Australia/Melbourne"],
    ["Auckland", "Pacific/Auckland"],
    ["Johannesburg", "Africa/Johannesburg"],
    ["Cairo", "Africa/Cairo"],
    ["Nairobi", "Africa/Nairobi"],
    ["Kigali", "Africa/Kigali"],
    ["Dar es Salaam", "Africa/Dar_es_Salaam"],
    ["Blantyre", "Africa/Blantyre"],
    ["Harare", "Africa/Harare"],
    ["Lusaka", "Africa/Lusaka"],
    ["Maputo", "Africa/Maputo"],
    ["Gaborone", "Africa/Gaborone"],
    ["Windhoek", "Africa/Windhoek"],
    ["Istanbul", "Europe/Istanbul"],
    ["Moscow", "Europe/Moscow"],
    ["UTC", "UTC"]
  ];

  // Representative coordinates per timezone, used only to fetch a live
  // weather reading for that city (Open-Meteo, no API key required).
  var TZ_COORDS = {
    "Europe/London": [51.5074, -0.1278],
    "Europe/Paris": [48.8566, 2.3522],
    "Europe/Dublin": [53.3498, -6.2603],
    "Europe/Lisbon": [38.7223, -9.1393],
    "Europe/Berlin": [52.5200, 13.4050],
    "Europe/Madrid": [40.4168, -3.7038],
    "Europe/Rome": [41.9028, 12.4964],
    "Europe/Amsterdam": [52.3676, 4.9041],
    "Europe/Istanbul": [41.0082, 28.9784],
    "Europe/Moscow": [55.7558, 37.6173],
    "America/New_York": [40.7128, -74.0060],
    "America/Los_Angeles": [34.0522, -118.2437],
    "America/Chicago": [41.8781, -87.6298],
    "America/Toronto": [43.6532, -79.3832],
    "America/Vancouver": [49.2827, -123.1207],
    "America/Mexico_City": [19.4326, -99.1332],
    "America/Sao_Paulo": [-23.5505, -46.6333],
    "Asia/Dubai": [25.2048, 55.2708],
    "Asia/Kolkata": [19.0760, 72.8777],
    "Asia/Singapore": [1.3521, 103.8198],
    "Asia/Hong_Kong": [22.3193, 114.1694],
    "Asia/Tokyo": [35.6762, 139.6503],
    "Asia/Seoul": [37.5665, 126.9780],
    "Asia/Shanghai": [31.2304, 121.4737],
    "Asia/Bangkok": [13.7563, 100.5018],
    "Australia/Sydney": [-33.8688, 151.2093],
    "Australia/Melbourne": [-37.8136, 144.9631],
    "Pacific/Auckland": [-36.8485, 174.7633],
    "Africa/Johannesburg": [-26.2041, 28.0473],
    "Africa/Cairo": [30.0444, 31.2357],
    "Africa/Nairobi": [-1.2921, 36.8219],
    "Africa/Kigali": [-1.9441, 30.0619],
    "Africa/Dar_es_Salaam": [-6.7924, 39.2083],
    "Africa/Blantyre": [-15.7861, 35.0058],
    "Africa/Harare": [-17.8292, 31.0522],
    "Africa/Lusaka": [-15.3875, 28.3228],
    "Africa/Maputo": [-25.9692, 32.5732],
    "Africa/Gaborone": [-24.6282, 25.9231],
    "Africa/Windhoek": [-22.5609, 17.0658]
  };

  var weatherCache = {}; // tz -> { temp, code, isDay }

  function isSwahiliTimeCity(city) {
    return /rwanda|tanzania|kenya|zanzibar/i.test(city.label);
  }

  function swahiliTimeString(tz, now) {
    var fmt = new Intl.DateTimeFormat("en-GB", {
      timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false
    });
    var parts = fmt.formatToParts(now).reduce(function(acc, p) {
      acc[p.type] = p.value; return acc;
    }, {});
    var h24 = parseInt(parts.hour, 10);
    var sHour = ((h24 - 6 + 12) % 12);
    if (sHour === 0) sHour = 12;
    return "Swahili time: Hour " + sHour;
  }

  function weatherIconFor(code, isDay) {
    var day = isDay !== false;
    if (code === 0) return day ? "☀️" : "🌙";
    if (code === 1) return day ? "🌤️" : "🌙";
    if (code === 2) return day ? "⛅" : "☁️";
    if (code === 3) return "☁️";
    if (code === 45 || code === 48) return "🌫️";
    if ([51, 53, 55, 56, 57].indexOf(code) !== -1) return "🌦️";
    if ([61, 63, 65, 66, 67].indexOf(code) !== -1) return "🌧️";
    if ([71, 73, 75, 77].indexOf(code) !== -1) return "❄️";
    if ([80, 81, 82].indexOf(code) !== -1) return "🌦️";
    if ([85, 86].indexOf(code) !== -1) return "🌨️";
    if ([95, 96, 99].indexOf(code) !== -1) return "⛈️";
    return "🌡️";
  }

  function fetchWeatherForTZ(tz) {
    var coords = TZ_COORDS[tz];
    if (!coords) return Promise.resolve(null);
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + coords[0] +
      "&longitude=" + coords[1] + "&current_weather=true&daily=sunrise,sunset&timezone=auto";
    return fetch(url)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (!data || !data.current_weather) return null;

        var offsetSec = data.utc_offset_seconds || 0;
        function localStrToUTCms(localStr) {
          // Open-Meteo gives local wall-clock time with no offset suffix;
          // parse it as if it were UTC, then shift by the real offset.
          return Date.parse(localStr + "Z") - offsetSec * 1000;
        }

        var upcoming = null;
        if (data.daily && data.daily.sunrise && data.daily.sunset) {
          var events = [];
          for (var i = 0; i < data.daily.time.length; i++) {
            if (data.daily.sunrise[i]) events.push({ type: "sunrise", ms: localStrToUTCms(data.daily.sunrise[i]) });
            if (data.daily.sunset[i]) events.push({ type: "sunset", ms: localStrToUTCms(data.daily.sunset[i]) });
          }
          var nowMs = Date.now();
          events = events.filter(function(e) { return e.ms > nowMs; }).sort(function(a, b) { return a.ms - b.ms; });
          if (events.length) upcoming = events[0];
        }

        return {
          temp: Math.round(data.current_weather.temperature),
          code: data.current_weather.weathercode,
          isDay: data.current_weather.is_day === 1,
          upcoming: upcoming
        };
      })
      .catch(function() { return null; });
  }

  function refreshWeather() {
    var uniqueTZs = [];
    cities.forEach(function(c) {
      if (TZ_COORDS[c.tz] && uniqueTZs.indexOf(c.tz) === -1) uniqueTZs.push(c.tz);
    });
    uniqueTZs.forEach(function(tz) {
      fetchWeatherForTZ(tz).then(function(result) {
        if (result) {
          weatherCache[tz] = result;
          paintWeather();
        }
      });
    });
  }

  function paintWeather() {
    var cards = grid.children;
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var city = card._city;
      if (!city) continue;
      var w = weatherCache[city.tz];
      var iconEl = card.querySelector('[data-role="wicon"]');
      var tempEl = card.querySelector('[data-role="wtemp"]');
      var sunIconEl = card.querySelector('[data-role="sunicon"]');
      var sunTimeEl = card.querySelector('[data-role="suntime"]');
      if (!iconEl || !tempEl) continue;
      if (w) {
        iconEl.textContent = weatherIconFor(w.code, w.isDay);
        tempEl.textContent = w.temp + "°C";
      } else {
        iconEl.textContent = "🌍";
        tempEl.textContent = "—";
      }

      if (sunIconEl && sunTimeEl) {
        if (w && w.upcoming) {
          var isSunrise = w.upcoming.type === "sunrise";
          var timeFmt = new Intl.DateTimeFormat("en-GB", {
            timeZone: city.tz, hour: "2-digit", minute: "2-digit", hour12: false
          });
          sunIconEl.textContent = isSunrise ? "☀️" : "🌙";
          sunTimeEl.textContent = timeFmt.format(new Date(w.upcoming.ms));
        } else {
          sunIconEl.textContent = "";
          sunTimeEl.textContent = "";
        }
      }
    }
  }

  function findLondonCity() {
    for (var i = 0; i < cities.length; i++) {
      if (/london/i.test(cities[i].label)) return cities[i];
    }
    return null;
  }

  function updateHeaderDate() {
    var headerDateEl = document.getElementById("headerDate");
    var headerTimeEl = document.getElementById("headerTime");
    if (!headerDateEl || !headerTimeEl) return;
    var londonCity = findLondonCity();
    var tz = londonCity ? londonCity.tz : "Europe/London";
    var now = new Date();

    var dateFmt = new Intl.DateTimeFormat("en-GB", {
      timeZone: tz, weekday: "long", day: "numeric", month: "long"
    });
    headerDateEl.textContent = (londonCity ? londonCity.label + " — " : "") + dateFmt.format(now);

    var timeFmt = new Intl.DateTimeFormat("en-GB", {
      timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false
    });
    headerTimeEl.textContent = timeFmt.format(now);
  }

  var DEFAULT_CITIES = [
    { label: "London", tz: "Europe/London" },
    { label: "Rwanda", tz: "Africa/Kigali" },
    { label: "Tanzania", tz: "Africa/Dar_es_Salaam" },
    { label: "Kenya", tz: "Africa/Nairobi" },
    { label: "Zanzibar", tz: "Africa/Dar_es_Salaam" },
    { label: "Malawi", tz: "Africa/Blantyre" },
    { label: "Zimbabwe", tz: "Africa/Harare" },
    { label: "Zambia", tz: "Africa/Lusaka" },
    { label: "Mozambique", tz: "Africa/Maputo" },
    { label: "Botswana", tz: "Africa/Gaborone" },
    { label: "Namibia", tz: "Africa/Windhoek" }
  ];

  function loadCities() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return DEFAULT_CITIES.slice();
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed) || parsed.length === 0) return DEFAULT_CITIES.slice();
      return parsed;
    } catch (e) {
      return DEFAULT_CITIES.slice();
    }
  }

  function saveCities(cities) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cities));
    } catch (e) { /* ignore quota / privacy-mode errors */ }
  }

  var cities = loadCities();

  var grid = document.getElementById("grid");
  var emptyState = document.getElementById("emptyState");
  var overlay = document.getElementById("overlay");
  var tzSelect = document.getElementById("tzSelect");
  var cityInput = document.getElementById("cityInput");
  var tzCustom = document.getElementById("tzCustom");
  var modalTitle = document.getElementById("modalTitle");

  COMMON_ZONES.forEach(function(z) {
    var opt = document.createElement("option");
    opt.value = z[1];
    opt.textContent = z[0] + " — " + z[1];
    tzSelect.appendChild(opt);
  });

  function openModal(index) {
    editingIndex = (typeof index === "number") ? index : null;
    if (editingIndex !== null) {
      modalTitle.textContent = "Edit city";
      cityInput.value = cities[editingIndex].label;
      var tz = cities[editingIndex].tz;
      var matched = COMMON_ZONES.some(function(z) { return z[1] === tz; });
      tzSelect.value = matched ? tz : tzSelect.options[0].value;
      tzCustom.value = matched ? "" : tz;
    } else {
      modalTitle.textContent = "Add a city";
      cityInput.value = "";
      tzSelect.selectedIndex = 0;
      tzCustom.value = "";
    }
    overlay.classList.add("open");
    setTimeout(function() { cityInput.focus(); }, 30);
  }

  function closeModal() {
    overlay.classList.remove("open");
    editingIndex = null;
  }

  document.getElementById("cancelAdd").addEventListener("click", closeModal);
  overlay.addEventListener("click", function(e) {
    if (e.target === overlay) closeModal();
  });

  document.getElementById("saveAdd").addEventListener("click", function() {
    var label = cityInput.value.trim();
    var tz = tzCustom.value.trim() || tzSelect.value;

    if (!label) { cityInput.focus(); return; }

    try {
      new Intl.DateTimeFormat("en-US", { timeZone: tz });
    } catch (e) {
      alert("That doesn't look like a valid timezone. Try something like Europe/Paris or Asia/Tokyo.");
      return;
    }

    if (editingIndex !== null) {
      cities[editingIndex] = { label: label, tz: tz };
    } else {
      cities.push({ label: label, tz: tz });
    }
    saveCities(cities);
    closeModal();
    render();
    refreshWeather();
  });

  function removeCity(index) {
    cities.splice(index, 1);
    saveCities(cities);
    render();
  }

  function getOffsetMinutes(tz, date) {
    try {
      var dtf = new Intl.DateTimeFormat("en-US", {
        timeZone: tz, hour12: false,
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
      var parts = dtf.formatToParts(date).reduce(function(acc, p) {
        acc[p.type] = p.value; return acc;
      }, {});
      var asUTC = Date.UTC(
        parseInt(parts.year, 10),
        parseInt(parts.month, 10) - 1,
        parseInt(parts.day, 10),
        parts.hour === "24" ? 0 : parseInt(parts.hour, 10),
        parseInt(parts.minute, 10),
        parseInt(parts.second, 10)
      );
      return Math.round((asUTC - date.getTime()) / 60000);
    } catch (e) {
      return 0;
    }
  }

  function formatOffset(mins) {
    var sign = mins >= 0 ? "+" : "-";
    var abs = Math.abs(mins);
    var h = Math.floor(abs / 60);
    var m = abs % 60;
    return "UTC" + sign + h + (m ? ":" + (m < 10 ? "0" + m : m) : "");
  }

  function buildCard(city, index) {
    var card = document.createElement("div");
    card.className = "card";

    var tint = document.createElement("div");
    tint.className = "tint-bar";
    card.appendChild(tint);

    var actions = document.createElement("div");
    actions.className = "card-actions";
    var editBtn = document.createElement("button");
    editBtn.className = "icon-btn";
    editBtn.title = "Edit";
    editBtn.textContent = "✎";
    editBtn.addEventListener("click", function() { openModal(index); });
    var delBtn = document.createElement("button");
    delBtn.className = "icon-btn danger";
    delBtn.title = "Remove";
    delBtn.textContent = "✕";
    delBtn.addEventListener("click", function() { removeCity(index); });
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    card.appendChild(actions);

    var top = document.createElement("div");
    top.className = "card-top";
    var nameWrap = document.createElement("div");
    var name = document.createElement("div");
    name.className = "city-name";
    name.textContent = city.label;
    var tzLabel = document.createElement("div");
    tzLabel.className = "tz-label";
    tzLabel.textContent = city.tz;
    nameWrap.appendChild(name);
    nameWrap.appendChild(tzLabel);
    var pill = document.createElement("div");
    pill.className = "offset-pill";
    pill.dataset.role = "offset";
    top.appendChild(nameWrap);
    top.appendChild(pill);
    card.appendChild(top);

    var time = document.createElement("div");
    time.className = "time";
    time.dataset.role = "time";
    card.appendChild(time);

    var swTime = document.createElement("div");
    swTime.className = "swahili-time";
    swTime.dataset.role = "swahili";
    card.appendChild(swTime);

    var weatherRow = document.createElement("div");
    weatherRow.className = "weather-row";
    var wIcon = document.createElement("span");
    wIcon.className = "icon";
    wIcon.dataset.role = "wicon";
    wIcon.textContent = "🌍";
    var wTemp = document.createElement("span");
    wTemp.className = "temp";
    wTemp.dataset.role = "wtemp";
    wTemp.textContent = "—";
    weatherRow.appendChild(wIcon);
    weatherRow.appendChild(wTemp);
    card.appendChild(weatherRow);

    var sunRow = document.createElement("div");
    sunRow.className = "sun-row";
    var sIcon = document.createElement("span");
    sIcon.className = "icon";
    sIcon.dataset.role = "sunicon";
    var sTime = document.createElement("span");
    sTime.dataset.role = "suntime";
    sunRow.appendChild(sIcon);
    sunRow.appendChild(sTime);
    card.appendChild(sunRow);

    card._city = city;
    card._tint = tint;
    return card;
  }

  function render() {
    grid.innerHTML = "";
    var cardCities = cities.filter(function(c) { return !/london/i.test(c.label); });
    if (cardCities.length === 0) {
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";
    cities.forEach(function(city, index) {
      if (/london/i.test(city.label)) return; // shown up top instead, not as a card
      grid.appendChild(buildCard(city, index));
    });
    tick();
    paintWeather();
  }

  function tick() {
    var now = new Date();
    var cards = grid.children;
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var city = card._city;
      if (!city) continue;

      var hourFmt = new Intl.DateTimeFormat("en-GB", {
        timeZone: city.tz, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
      });
      var parts = hourFmt.formatToParts(now).reduce(function(acc, p) {
        acc[p.type] = p.value; return acc;
      }, {});
      var hh = parts.hour, mm = parts.minute, ss = parts.second;

      var timeEl = card.querySelector('[data-role="time"]');
      timeEl.innerHTML = hh + ":" + mm + '<span class="secs">:' + ss + "</span>";

      var swEl = card.querySelector('[data-role="swahili"]');
      if (swEl) swEl.textContent = isSwahiliTimeCity(city) ? swahiliTimeString(city.tz, now) : "";

      var offsetMins = getOffsetMinutes(city.tz, now);
      var pillEl = card.querySelector('[data-role="offset"]');
      pillEl.textContent = formatOffset(offsetMins);

      var h = parseInt(hh, 10);
      var isDay = h >= 7 && h < 19;
      card._tint.className = "tint-bar " + (isDay ? "tint-day" : "tint-night");
    }
    updateHeaderDate();
  }

  render();
  paintWeather();
  refreshWeather();
  setInterval(tick, 1000);
  setInterval(refreshWeather, 20 * 60 * 1000); // refresh weather every 20 min
})();
</script>
</body>
</html>
